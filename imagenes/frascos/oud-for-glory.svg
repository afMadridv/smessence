    <clipPath id="recorte-cuerpo"><path d="M104,272 H296 a16,16 0 0 1 16,16 V474 a16,16 0 0 1 -16,16 H104 a16,16 0 0 1 -16,-16 V288 a16,16 0 0 1 16,-16 Z"/></clipPath>
